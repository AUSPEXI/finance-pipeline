<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SDSP Finance Suite App - Secure Data Sharing Platform with zk-SNARKs. Stream 8 Finance Suites with Advanced Analytics and FCA/SEC Compliance." />
    <meta name="keywords" content="SDSP, finance, AI, streaming data, synthetic data, zk-SNARKs, FCA compliance, SEC compliance, credit scoring, trading signals" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>SDSP Finance Suite App - Secure Data Sharing Platform</title>
    <style>
      /* CRITICAL: Minimal inline styles to prevent any flashing */
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: #f3f4f6 !important;
        color: #111827 !important;
        font-family: 'Inter', sans-serif !important;
        min-height: 100vh !important;
        overflow-x: hidden !important;
        -webkit-font-smoothing: antialiased !important;
        -moz-osx-font-smoothing: grayscale !important;
      }
      
      #root {
        background: #f3f4f6 !important;
        color: #111827 !important;
        min-height: 100vh !important;
        width: 100% !important;
        position: relative !important;
      }
      
      /* Loading screen that never changes */
      .loading-screen {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background: #f3f4f6 !important;
        z-index: 999999 !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        font-family: 'Inter', sans-serif !important;
        color: #6b7280 !important;
      }
      
      .loading-spinner {
        width: 40px !important;
        height: 40px !important;
        border: 4px solid #e5e7eb !important;
        border-top: 4px solid #1e40af !important;
        border-radius: 50% !important;
        animation: spin 1s linear infinite !important;
        margin-bottom: 16px !important;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide app content completely until explicitly shown */
      .app-container {
        display: none !important;
        opacity: 0 !important;
        background: #f3f4f6 !important;
        color: #111827 !important;
        min-height: 100vh !important;
        width: 100% !important;
      }
      
      /* Only show when explicitly ready */
      .show-app .app-container {
        display: block !important;
        opacity: 1 !important;
      }
      
      .show-app .loading-screen {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Fixed loading screen -->
      <div class="loading-screen" id="loading-screen">
        <div class="loading-spinner"></div>
        <p style="margin: 0; font-size: 14px; color: #6b7280; font-weight: 500;">Loading SDSP Finance Suite App...</p>
        <p style="margin: 8px 0 0 0; font-size: 12px; color: #9ca3af;">Secure Data Sharing Platform with zk-SNARKs</p>
        <p style="margin: 4px 0 0 0; font-size: 11px; color: #d1d5db;">Initializing 1M records/day pipeline with FCA/SEC compliance</p>
      </div>
      
      <!-- App content container - completely hidden -->
      <div class="app-container" id="app-container">
        <!-- React will render here -->
      </div>
    </div>
    
    <script>
      // Prevent any flashing by controlling when content is shown
      window.showApp = function() {
        console.log('🎯 Showing SDSP Finance Suite App content');
        document.documentElement.classList.add('show-app');
      };
      
      // Named function for setTimeout callback
      function forceShowAppAfterTimeout() {
        if (!document.documentElement.classList.contains('show-app')) {
          console.log('⏰ Force showing app after timeout');
          window.showApp();
        }
      }
      
      // Force show after maximum wait time
      setTimeout(forceShowAppAfterTimeout, 8000); // 8 second maximum wait
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
